name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Include the lane marker in the preview
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.34.9 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Configure lane
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          {
            echo "LANE_ID=lane-07"
            if [ "${{ inputs.lane_marker }}" = "true" ]; then
              echo "LANE_MARKER=$LANE_MARKER"
            else
              echo "LANE_MARKER="
            fi
            echo "PORT=8787"
          } > .env

      - name: Start rig
        run: |
          pnpm start > /tmp/rig.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/digest/2026-10-28 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/digest/2026-10-28 > /tmp/index.html

      - name: Prepare Pages artifact
        run: |
          mkdir site
          cp /tmp/index.html site/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
